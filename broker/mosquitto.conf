# =====================================================================
# Mosquitto MQTT Broker - Cấu hình cho đồ án HTPT
# =====================================================================
# Cách chạy:
#   mosquitto -c mosquitto.conf -v
#   (-v để in log chi tiết, tiện debug)
# =====================================================================

# Lắng nghe trên TCP 1883 cho tất cả interface (LAN) - cho ESP32 kết nối
listener 1883 0.0.0.0
protocol mqtt

# Lắng nghe trên TCP 9001 cho WebSocket - cho Node-RED dashboard hoặc trang web
listener 9001 0.0.0.0
protocol websockets

# Đồ án không cần xác thực - cho phép kết nối ẩn danh
# CẢNH BÁO: chỉ dùng trong môi trường lab/demo, KHÔNG dùng cho production
allow_anonymous true

# Log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# Persistence - lưu lại retained message khi restart
persistence true
persistence_location ./mosquitto_data/

# Keepalive tối đa 60s (mặc định ESP32 PubSubClient là 15s)
# Không bắt buộc, để mặc định
