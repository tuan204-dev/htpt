# =====================================================================
# Mosquitto config - dành riêng cho container Docker
# Khác với broker/mosquitto.conf (chạy native): paths theo chuẩn image
# eclipse-mosquitto: /mosquitto/data/, /mosquitto/log/
# =====================================================================

# MQTT cho ESP32 và Node.js server
listener 1883 0.0.0.0
protocol mqtt

# WebSocket - cho phép web kết nối trực tiếp nếu cần (không qua server Node.js)
listener 9001 0.0.0.0
protocol websockets

# ----- Authentication -----
# Tắt anonymous - mọi client phải xác thực username/password
allow_anonymous false

# File password (đã được hash) - tạo bằng setup-auth.sh
password_file /mosquitto/config/mosquitto.passwd

# File ACL - phân quyền publish/subscribe theo user
acl_file /mosquitto/config/mosquitto.acl

# ----- Persistence -----
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# ----- Logging -----
# Log ra stdout để `docker compose logs` đọc được
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# ----- Limits -----
max_connections -1
max_inflight_messages 20
max_queued_messages 1000
